<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casebook">
<meta name="theme-color" content="#F6F2FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Casebook Zahro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8FF;--sf:#fff;--ink:#1F2340;--mu:#6B7090;--ln:#ECE9F7;--ac:#6D5DF5;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
background:var(--bg);background-image:radial-gradient(60% 320px at 0% 0%,#E9E4FF,transparent),radial-gradient(50% 280px at 100% 6%,#FFE3F0,transparent),radial-gradient(60% 300px at 50% 100%,#DDF4EA,transparent);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#F4F0FF;z-index:10}
#app{max-width:560px;margin:0 auto;padding:0 18px 110px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(246,242,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -18px;padding:10px 18px 8px;z-index:5}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ac);font-weight:600;padding:6px 0}
.search,.in{width:100%;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 14px;font:inherit}
.search{height:46px}.search::placeholder,.in::placeholder{color:#A3A7C2}
.sw{position:relative}.sw svg{position:absolute;left:14px;top:14px;color:var(--mu)}.sw .search{padding-left:42px}
.hero{margin-top:22px;border-radius:26px;padding:22px 20px;color:var(--ink);background:linear-gradient(135deg,#DCD6FF,#FBD3E6 60%,#FFE5CC);position:relative;overflow:hidden;box-shadow:0 10px 30px -12px rgba(124,92,250,.35)}
.hero::before{content:"";position:absolute;right:-36px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.45)}
.hero::after{content:"";position:absolute;right:54px;bottom:-56px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:2px 0 4px;font-size:30px;font-weight:700;letter-spacing:-.02em}
.hi,.hs{margin:0;color:#4B4F78}
.hst{display:flex;gap:8px;margin-top:16px}
.hst div{flex:1;background:rgba(255,255,255,.7);border-radius:16px;padding:9px 12px}
.hst b{display:block;font-size:20px;font-weight:700;line-height:1.2}.hst span{font-size:12px;color:var(--mu)}
.grp{font-size:13px;font-weight:600;color:var(--mu);margin:22px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:12px;width:100%;border-radius:20px;padding:14px;background:color-mix(in srgb,var(--mc) 14%,#fff);border:1.5px solid color-mix(in srgb,var(--mc) 22%,#fff)}
.tile b{font-weight:600;line-height:1.3}.tile small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--mc) 28%,#fff);color:color-mix(in srgb,var(--mc) 72%,#000)}
.ib.s{width:26px;height:26px;border-radius:9px;display:inline-grid;margin-right:8px}
.item{display:block;width:100%;background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:9px;box-shadow:0 4px 14px -10px rgba(80,70,160,.3)}
.cc,.faqi,.sec{border-left:5px solid var(--mc)}
.meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--mu)}.idt{font-weight:600}
.chip{background:color-mix(in srgb,var(--mc) 18%,#fff);color:color-mix(in srgb,var(--mc) 65%,#000);border-radius:99px;padding:2px 10px;font-weight:500}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.fav{display:flex;margin-left:auto;color:#F5A524}
.mh{display:flex;align-items:center;gap:12px;margin:6px 0 4px}.mh h1{margin:0;font-size:22px;letter-spacing:-.01em}
.seg{display:flex;background:color-mix(in srgb,var(--mc) 14%,#fff);border-radius:14px;padding:3px;margin:10px 0}
.seg button{flex:1;text-align:center;padding:8px;border-radius:11px;color:var(--mu);font-weight:500}
.seg button[aria-selected=true]{background:var(--sf);color:color-mix(in srgb,var(--mc) 70%,#000);font-weight:600;box-shadow:0 2px 6px -2px rgba(0,0,0,.15)}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
.empty .ib{margin:0 auto 12px;width:56px;height:56px;border-radius:18px}
h2{font-size:19px;line-height:1.4;font-weight:600;margin:10px 0 4px;letter-spacing:-.01em}
.sec{background:var(--sf);border:1.5px solid var(--ln);border-left:5px solid var(--mc);border-radius:16px;margin-top:12px;padding:14px 16px}
.sec.hl{background:color-mix(in srgb,var(--mc) 9%,#fff)}
.sec h3{margin:0 0 8px;font-size:14px;font-weight:600;color:color-mix(in srgb,var(--mc) 70%,#000);display:flex;align-items:center}
.txt p{margin:0 0 8px;overflow-wrap:anywhere}.txt p:last-child{margin:0}
.txt ol{margin:0 0 8px;padding:0;list-style:none;counter-reset:n}
.txt li{counter-increment:n;position:relative;padding-left:30px;margin-bottom:8px;overflow-wrap:anywhere}
.txt li::before{content:counter(n);position:absolute;left:0;top:2px;width:21px;height:21px;border-radius:50%;background:color-mix(in srgb,var(--mc) 25%,#fff);color:color-mix(in srgb,var(--mc) 70%,#000);font-size:12px;font-weight:700;display:grid;place-items:center}
.q{width:100%;display:flex;gap:10px;align-items:center;font-weight:500}.q>span:nth-child(2){flex:1}
.qi{color:var(--mc);display:flex}.q i{display:flex;color:var(--mu);transition:transform .2s}
.q[aria-expanded=true] i{transform:rotate(90deg)}
.ans{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--ln)}
.lk{color:var(--ac);font-weight:600;margin:8px 14px 0 0;display:inline-flex;align-items:center;gap:5px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(250,248,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1.5px solid var(--ln);display:flex;gap:8px;justify-content:center;z-index:6}
.btn{flex:1;max-width:200px;height:46px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.p{background:var(--mc);border-color:var(--mc);color:#fff}
.btn.d{color:#D6456B;border-color:#F8CBD8;background:#FFF1F5;flex:0 0 auto;max-width:none;padding:0 16px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--mc);color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -8px color-mix(in srgb,var(--mc) 70%,#000);z-index:6}
.fld{margin-top:14px}.fld label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:0 0 6px 2px}
.in{padding:11px 14px;line-height:1.5;resize:vertical;min-height:46px}
.in:focus{outline:none;border-color:var(--mc)}
.note{color:var(--mu);font-size:12.5px;text-align:center;margin:26px 0 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hb{position:absolute;right:14px;top:14px;display:flex;gap:8px;z-index:2}
.hbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.72);display:grid;place-items:center;color:var(--ink)}
.ph{font-size:26px;margin:26px 0 4px;letter-spacing:-.02em}.sub{color:var(--mu);margin:0}
.wide{flex-direction:row;align-items:center;gap:14px;margin-bottom:6px}
.stats{display:flex;gap:8px;margin:10px 0}
.stats div{flex:1;background:color-mix(in srgb,var(--mc) 12%,#fff);border:1.5px solid color-mix(in srgb,var(--mc) 22%,#fff);border-radius:16px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-weight:700;line-height:1.2}.stats span{font-size:12px;color:var(--mu)}
.ar{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px}.ar span{width:84px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar .tr{flex:1;height:10px;border-radius:99px;background:var(--ln);overflow:hidden}.ar .tr i{display:block;height:100%;border-radius:99px}.ar b{width:22px;text-align:right;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--ln);background:var(--sf);font-weight:500;font-size:13.5px}
.fc[aria-pressed=true]{background:color-mix(in srgb,var(--mc) 22%,#fff);border-color:var(--mc);font-weight:600}
.rc{display:flex;gap:14px;align-items:flex-start;border-left:5px solid var(--mc)}
.db{flex:none;width:54px;border-radius:14px;background:color-mix(in srgb,var(--mc) 16%,#fff);color:color-mix(in srgb,var(--mc) 70%,#000);text-align:center;padding:6px 0}
.db b{display:block;font-size:20px;line-height:1.15}.db span{font-size:12px;font-weight:600}
.rb{min-width:0;flex:1}.rs{color:var(--mu);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.two{display:flex;gap:10px}.two .fld{flex:1}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
let D=[];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
usr:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
wal:'<path d="M20 12V8a2 2 0 0 0-2-2H5a2 2 0 0 1 0-4h12v4"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
pres:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
grp:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
cap:'<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
award:'<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/>',
target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
brief:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
id:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h5M14 14h4"/>',
feed:'<path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>',
alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
arr:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4"/>',
help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
next:'<path d="m9 18 6-6-6-6"/>',prev:'<path d="m15 18-6-6 6-6"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',sync:'<path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M16 16h5v5"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>'};
Object.assign(IC,{cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',bld:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/>'});
const ic=(n,s=20,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const mm=n=>{n=n.toLowerCase();const t=(a,b)=>({i:a,c:b});
return n.includes('cbt x')?t('clip','#6366F1'):n.includes('cbt')?t('clip','#8B7CF6'):n.includes('pmb rpl')?t('usr','#14B8A6'):n.includes('pmb')?t('usr','#2BB98A'):n.includes('keuangan')?t('wal','#F5A524'):n.includes('krs')?t('list','#4C9AFF'):n.includes('(op')?t('cog','#38BDF8'):n.includes('proposal')?t('doc','#FB7185'):n.includes('yudisium')?t('cap','#FB923C'):n.includes('skpi')?t('award','#F472B6'):n.includes('dosen')?t('pres','#4C9AFF'):n.includes('mahasiswa')?t('grp','#F472B6'):n.includes('profeeder')?t('feed','#14B8A6'):n.includes('obe')?t('target','#FB923C'):n.includes('kepegawaian')?t('id','#6366F1'):n.includes('spmi')?t('shield','#2BB98A'):n.includes('karir')?t('brief','#F5A524'):t('book','#8B7CF6')};
const jc=j=>{j=(j||'').toLowerCase();return j.includes('konfig')?'#4C9AFF':j.includes('alur')?'#8B7CF6':j.includes('kebutuhan')?'#FB923C':j.includes('fitur')?'#2BB98A':'#94A3B8'};
let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch(e){}
const saveFav=()=>{try{localStorage.setItem('fav',JSON.stringify([...favs]))}catch(e){}};
let tab='c',q='',gq='',st='',ts=0,cfg={};
try{cfg=JSON.parse(localStorage.getItem('cb_cfg')||'{}')}catch(e){}
try{D=JSON.parse(localStorage.getItem('cb_data')||'[]')}catch(e){}
const keyAll=()=>D.forEach((m,i)=>{m.cases.forEach(c=>c.k=`m${i}-c${c.row}`);m.faqs.forEach(f=>f.k=`m${i}-f${f.row}`)});
function setData(mods){D=mods;keyAll();try{localStorage.setItem('cb_data',JSON.stringify(D))}catch(e){}}
keyAll();
async function api(action,p={}){
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({kode:cfg.kode,action,...p})});
  const j=await r.json();if(!j.ok){const e=new Error(j.error||'Gagal');e.code=j.code;throw e}return j}
const repl=(mi,m)=>{D[mi]=m;setData(D)};
const errMsg=e=>e.code=='auth'?'Kode rahasia ditolak':e instanceof TypeError?'Tidak ada koneksi':e.message;
const stTxt=()=>({sync:'Menyinkronkan…',ok:'Tersinkron dengan Google Sheets',off:'Offline: menampilkan data terakhir',auth:'Kode rahasia ditolak. Cek Pengaturan.'})[st]||'';
const status=()=>{const e=$('#st');if(e)e.textContent=stTxt()};
async function sync(){
  if(!cfg.url)return;st='sync';status();
  try{const j=await api('list');setData(j.modules);setLog(j.log);st='ok';ts=Date.now()}catch(e){st=e.code=='auth'?'auth':'off'}
  const h=location.hash.slice(1),a=document.activeElement;
  if((!h||/^(m\d+|riwayat)$/.test(h))&&!(a&&a.matches&&a.matches('input,textarea')))route();else status()}
const SETUP=`<button class="item cc" style="--mc:#F5A524" data-go="pengaturan"><div class="meta"><span class="chip">Langkah pertama</span></div><div class="clamp" style="-webkit-line-clamp:4">Hubungkan aplikasi ke Google Sheets-mu. Ketuk di sini untuk mengisi alamat Web App dan kode rahasia.</div></button>`;
function fmt(t){let h='',ol=false;String(t).split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^(\d+)[.)]\s*(.*)/);if(m){if(!ol){h+='<ol>';ol=true}h+='<li>'+esc(m[2])+'</li>'}else{if(ol){h+='</ol>';ol=false}h+='<p>'+esc(l)+'</p>'}});return h+(ol?'</ol>':'')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
const hit=(o,s)=>!s||[o.id,o.jenis,o.q,o.kondisi,o.sistem,o.solusi,o.sumber,o.next,o.s,o.d].join(' ').toLowerCase().includes(s.toLowerCase());
const caseCard=(c)=>`<button class="item cc" style="--mc:${jc(c.jenis)}" data-go="${c.k}"><div class="meta">${c.id?`<span class="idt">${esc(c.id)}</span>`:''}${c.jenis?`<span class="chip">${esc(c.jenis)}</span>`:''}${favs.has(c.k)?`<span class="fav">${ic('star',15,1)}</span>`:''}</div><div class="clamp">${esc(c.q)}</div></button>`;
function home(){
  const nc=D.reduce((a,m)=>a+m.cases.length,0),nf=D.reduce((a,m)=>a+m.faqs.length,0);
  app.innerHTML=`<div class="hero"><div class="hb"><button class="hbtn" data-sync aria-label="Muat ulang">${ic('sync',18)}</button><button class="hbtn" data-go="pengaturan" aria-label="Pengaturan">${ic('cog',18)}</button></div><p class="hi">Halo, Zahro</p><h1>Casebook</h1><p class="hs">Siap untuk pelatihan hari ini?</p><div class="hst"><div><b>${nc}</b><span>Case</span></div><div><b>${nf}</b><span>FAQ</span></div><div><b>${D.length}</b><span>Modul</span></div></div></div>
  <div class="top"><div class="sw">${ic('search',18)}<input class="search" id="gs" type="search" placeholder="Cari case atau FAQ di semua modul" value="${esc(gq)}"></div></div><div id="out"></div>`;
  const gs=$('#gs');gs.oninput=()=>{gq=gs.value;homeOut()};homeOut()}
function homeOut(){
  let h='';
  if(gq){let n=0;D.forEach(m=>{const cs=m.cases.filter(c=>hit(c,gq)),fs=m.faqs.filter(f=>hit(f,gq));

  if(m=h.match(/^x-r(\d+|new)$/))return rform(m[1]);
  if(m=h.match(/^x-m(\d+)-([cf])(.+)$/))return form(+m[1],m[2],m[3]);
  if(m=h.match(/^m(\d+)-c(.+)$/)){const c=D[m[1]]&&D[m[1]].cases.find(x=>x.k===h);if(c)return detail(+m[1],c)}
  if(m=h.match(/^m(\d+)-f(.+)$/)){const f=D[m[1]]&&D[m[1]].faqs.find(x=>x.k===h);if(f){tab='f';q=f.q;return mod(+m[1])}}
  if((m=h.match(/^m(\d+)$/))&&D[m[1]])return mod(+m[1]);
  q='';home()}
